# oss-catalog.yaml — canonical inventory of reusable OSS for defi4refi builds
#
# Policy (per project owner):
#   - All license classes usable: permissive, copyleft (GPL/AGPL/LGPL/MPL),
#     and source-available (BUSL/SSPL/BSL). Copyleft is fine; source-available
#     is treated like copyleft — obligations recorded, nothing banned.
#   - Custom-authored code must be <5% of delivered LOC per repo.
#     Vendor/fork from this catalog first; write new code only where no
#     catalog component fits. See docs/CUSTOM-CODE-AUDIT.md and
#     tools/custom-code.sh.
#   - Every delivered repo must regenerate docs/OSS-LICENSES.md listing
#     vendored components with license + obligations.
#
# class values: permissive | copyleft | source-available
# tier: T1 = protocol contracts, T2 = dApp frontend, T3 = adjacent modules,
#       OPS = studio infrastructure, LEADS = intake/data

policy:
  custom_code_cap_pct: 5
  vendored_markers: [lib/, vendor/, upstream/, third_party/, node_modules/, .venv/]
  copyleft_allowed: true
  source_available_allowed: true  # BUSL/SSPL/BSL treated like copyleft; obligations recorded
  banned: []

tier1_contracts:
  # --- Owned stack ---
  - repo: defi4refi/rooted-finance
    path: ~/CascadeProjects/rooted-finance/contracts/src
    license: AGPL-3.0
    class: copyleft
    modules: [RootsToken, RootsStaking, wstROOTS, TreasuryValuation, RootsBondPricer,
              RootsInverseBond, Bucky-stablecoin, RootsCollateralManager,
              ReferralRegistry, MultisigGuard, RootsCircuitBreaker, RootsDeployer]
    tier: T1
    use: "Primary T1 template — full protocol-in-a-box (token, staking, bonds, treasury, stablecoin, governance glue)"
    notes: "Owned AGPL — derived client work inherits AGPL; publish source (aligned with open-source delivery anyway)."

  - repo: defi4refi/abyayala
    path: ~/CascadeProjects/abyayala
    license: AGPL-3.0
    class: copyleft
    modules: []
    tier: T1
    use: "Secondary contract patterns — check src/ for regen-specific modules"
    notes: "Owned AGPL."

  - repo: localchimera
    path: ~/Documents/docker/localchimera/contracts
    license: custom-copyright
    class: copyleft
    modules: []
    tier: T1
    use: "Cashu/ecash + Casper experiments — reuse only for ecash-adjacent asks"
    notes: "Owned; no standard OSS license — treat as internal code, no external obligations."

  # --- Vendored solidity libs (rooted-finance/contracts/lib, submodules) ---
  - repo: OpenZeppelin/openzeppelin-contracts
    path: contracts/lib/openzeppelin (+ openzeppelin-v4, oz-v4.8.0, oz-v5.3.0, openzeppelin-contracts-upgradeable)
    license: MIT
    class: permissive
    modules: [ERC20, AccessControl, ReentrancyGuard, Pausable, Governor, UUPS proxies, SafeERC20]
    tier: T1
    use: "Base primitives for everything"
    notes: "Keep copyright line."

  - repo: OlympusDAO/olympus-v3
    path: contracts/lib/olympus-v3
    license: AGPL-3.0
    class: copyleft
    modules: [Kernel, Modules, Policies, PRICE oracle, Treasury]
    tier: T1
    use: "Kernel/Policy architecture for treasury-backed protocols"
    notes: "Derived work AGPL — publish source."

  - repo: Bond-Protocol/bond-contracts
    path: contracts/lib/bond-protocol
    license: AGPL-3.0
    class: copyleft
    modules: [Bond market, teller, auctioneer]
    tier: T1
    use: "Bond/purchase mechanics"

  - repo: makerdao/dss
    path: contracts/lib/dss
    license: AGPL-3.0-or-later
    class: copyleft
    modules: [vat, cat, flip, jug, pot, OSM — CDP/stablecoin core]
    tier: T1
    use: "Stablecoin/CDP systems (Bucky pattern)"

  - repo: Uniswap/v2-core + v2-periphery
    path: contracts/lib/v2-core, contracts/lib/v2-periphery
    license: GPL-3.0-or-later
    class: copyleft
    modules: [AMM pair, router]
    tier: T1
    use: "AMM liquidity for token launches"

  - repo: Uniswap/v4-hooks-public
    path: contracts/lib/v4-hooks-public
    license: MIT
    class: permissive
    modules: [v4 hook templates]
    tier: T1
    use: "Custom AMM hook builds"
    notes: "v4-core itself is BUSL-1.1 — see source-available entry below."

  - repo: Uniswap/v4-core
    license: BUSL-1.1
    class: source-available
    modules: [PoolManager, v4 AMM core]
    tier: T1
    use: "v4 pool dependency for hook builds"
    notes: "BUSL-1.1 converts to GPL-2.0-or-later at change date (per repo LICENSE). Allowed per policy; record obligations."

  - repo: OpenZeppelin/uniswap-hooks
    path: contracts/lib/uniswap-hooks
    license: MIT
    class: permissive
    modules: [BaseCustomCurve, BaseDynamicFee, BaseHook]
