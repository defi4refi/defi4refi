  - repo: lido-finance/core
    path: contracts/lib/core
    license: GPL-3.0
    class: copyleft
    modules: [stETH rebasing patterns, withdrawal queue]
    tier: T1
    use: "Rebasing-token reference (stROOTS pattern derives from it)"

  - repo: balancer/balancer-v2-monorepo
