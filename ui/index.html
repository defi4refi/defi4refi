<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>defi4refi — lead browser</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--fg:#e6edf3;--dim:#8b949e;--acc:#3fb950;--acc2:#58a6ff}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
header{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:16px;font-weight:600}
h1 span{color:var(--acc)}
input,select{background:var(--panel);border:1px solid var(--border);color:var(--fg);border-radius:6px;padding:6px 10px;font-size:13px}
input#q{width:300px}
button{background:var(--panel);border:1px solid var(--border);color:var(--fg);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px}
button:hover{border-color:var(--acc2)}
button.on{background:#1f6feb33;border-color:var(--acc2);color:var(--acc2)}
main{flex:1;display:flex;overflow:hidden}
#list{flex:1;overflow:auto}
#detail{width:420px;border-left:1px solid var(--border);overflow:auto;background:var(--panel);padding:16px}
#detail.hidden{display:none}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;background:var(--panel);text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.4px;cursor:pointer;user-select:none;white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid #21262d;vertical-align:top}
tr:hover td{background:#161b2288;cursor:pointer}
tr.sel td{background:#1f6feb22}
.money{color:var(--acc);font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;border:1px solid var(--border);color:var(--dim);margin:1px 2px 1px 0}
.tag.verified{border-color:var(--acc);color:var(--acc)}
.badge{background:#1f6feb;color:#fff;border-radius:10px;padding:0 7px;font-size:11px}
.contact{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border:1px solid #21262d;border-radius:6px;margin-bottom:6px;font-size:13px}
.contact .ch{color:var(--acc2);min-width:70px}
.contact .val{word-break:break-all;flex:1}
.ev{padding:6px 8px;border-left:2px solid var(--border);margin:6px 0;font-size:12px;color:var(--dim)}
.ev b{color:var(--fg)}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);margin:16px 0 8px}
#detail h2{font-size:17px;margin-bottom:4px}
a{color:var(--acc2);text-decoration:none}
a:hover{text-decoration:underline}
#stats{color:var(--dim);font-size:12px;margin-left:auto}
.scorebar{height:4px;background:#21262d;border-radius:2px;overflow:hidden;margin-top:4px}
.scorebar i{display:block;height:100%;background:var(--acc)}
.pager{display:flex;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--border);font-size:12px;color:var(--dim)}
</style></head><body>
<header>
  <h1>defi<span style="color:var(--acc)">4</span>refi · lead browser</h1>
  <input id="q" placeholder="search name / domain / handle…" autofocus>
  <select id="filt">
    <option value="queue">outreach queue</option>
    <option value="funded_contactable">funded + contactable</option>
    <option value="funded">all funded</option>
    <option value="all">all orgs</option>
  </select>
  <select id="sort">
    <option value="score">sort: score</option>
    <option value="funding_usd">sort: funding</option>
    <option value="days">sort: recent funding</option>
    <option value="name">sort: name</option>
  </select>
  <span id="stats"></span>
</header>
<main>
  <div id="list"></div>
  <div id="detail" class="hidden"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const api = async q => (await fetch('/api?q='+encodeURIComponent(q))).json();
const fmt$ = n => n>=1e6?'$'+(n/1e6).toFixed(1)+'M':n>=1e3?'$'+(n/1e3).toFixed(0)+'k':n>0?'$'+Math.round(n):'';
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let rows=[], sel=null, page=0; const PS=200;

async function load(){
  const f=$('#filt').value, s=$('#sort').value, q=$('#q').value.trim().replace(/'/g,"''");
  let where="1=1", join="";
  if(f==='funded') where="v.funding_usd>0";
  if(f==='funded_contactable') where="v.funding_usd>0 AND cc.ncontacts>0";
  if(f==='queue') where="v.score>=35";
  if(q) where+=` AND (v.canonical_name ILIKE '%${q}%' OR v.domain ILIKE '%${q}%' OR v.github ILIKE '%${q}%' OR v.twitter ILIKE '%${q}%')`;
  const order = s==='funding_usd'?'v.funding_usd DESC':s==='days'?'v.days_since_funded ASC':s==='name'?'v.canonical_name ASC':'v.score DESC';
  const r = await api(`SELECT v.org_id,v.canonical_name,v.domain,v.funding_usd,v.score,v.days_since_funded,
    v.sources,v.twitter,v.github,v.tech_fit,v.regen_fit,cc.ncontacts
    FROM defi4refi.v_scored v
    LEFT JOIN (SELECT org_id,count() AS ncontacts FROM defi4refi.contacts GROUP BY org_id) cc ON cc.org_id=v.org_id
    WHERE ${where} ORDER BY ${order} LIMIT 20000`);
  if(r.error){$('#list').innerHTML='<p style="padding:16px">'+esc(r.error)+'</p>';return}
  rows=r.rows; page=0; sel=null; $('#detail').classList.add('hidden'); render();
}

function render(){
  const slice=rows.slice(page*PS,(page+1)*PS);
  $('#stats').textContent=`${rows.length.toLocaleString()} orgs`;
  $('#list').innerHTML=`<table><thead><tr>
    <th>org</th><th>funding</th><th>score</th><th>contacts</th><th>sources</th></tr></thead><tbody>`+
    slice.map((r,i)=>`<tr data-i="${page*PS+i}" class="${sel===page*PS+i?'sel':''}">
      <td><b>${esc(r.canonical_name)}</b><br><span class="dim" style="font-size:12px">${esc(r.domain||r.org_id)}</span></td>
      <td class="money">${fmt$(r.funding_usd)}<br><span class="dim" style="font-size:11px">${r.days_since_funded<99999?r.days_since_funded+'d ago':''}</span></td>
      <td>${r.score?.toFixed(0)||''}<div class="scorebar"><i style="width:${Math.min(100,r.score||0)}%"></i></div></td>
      <td>${r.ncontacts?`<span class="badge">${r.ncontacts}</span>`:'<span class="dim">—</span>'}</td>
      <td class="dim" style="font-size:11px;max-width:220px">${esc((r.sources||'').split(',').slice(0,4).join(', '))}</td>
    </tr>`).join('')+`</tbody></table>
    <div class="pager"><button id="prev" ${page===0?'disabled':''}>← prev</button>
    <span>${page*PS+1}–${Math.min((page+1)*PS,rows.length)}</span>
    <button id="next" ${(page+1)*PS>=rows.length?'disabled':''}>next →</button></div>`;
  document.querySelectorAll('#list tbody tr').forEach(t=>t.onclick=()=>show(+t.dataset.i));
  $('#prev').onclick=e=>{e.stopPropagation();if(page>0){page--;render()}};
  $('#next').onclick=e=>{e.stopPropagation();if((page+1)*PS<rows.length){page++;render()}};
}

async function show(i){
  sel=i; render(); const r=rows[i], d=$('#detail');
  d.classList.remove('hidden'); d.innerHTML='<p class="dim">loading…</p>';
  const [c,f]=await Promise.all([
    api(`SELECT channel,value,verified,source,person_name,person_title,evidence_url FROM defi4refi.contacts WHERE org_id='${r.org_id.replace(/'/g,"''")}' ORDER BY verified DESC,channel`),
    api(`SELECT source,program,amount_usd,event_date,evidence FROM defi4refi.funding_events WHERE org_id='${r.org_id.replace(/'/g,"''")}' ORDER BY event_date DESC LIMIT 50`)]);
  const cs=c.rows||[],fs=f.rows||[];
  d.innerHTML=`<h2>${esc(r.canonical_name)}</h2>
    <div class="dim" style="margin-bottom:8px">
      ${r.domain?`<a href="https://${esc(r.domain)}" target="_blank">${esc(r.domain)}</a> · `:''}
      score ${r.score?.toFixed(1)} · ${fmt$(r.funding_usd)} funded
      ${r.days_since_funded<99999?` · ${r.days_since_funded}d ago`:''}</div>
    <div>${(r.sources||'').split(',').map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div>
    <h3>contacts (${cs.length})</h3>`+
    (cs.length?cs.map(x=>`<div class="contact"><span class="ch">${esc(x.channel)}</span>
      <span class="val">${esc(x.value)}${x.person_name?`<br><span class="dim">${esc(x.person_name)} ${esc(x.person_title||'')}</span>`:''}
      ${x.evidence_url?`<br><a class="dim" style="font-size:11px" href="${esc(x.evidence_url)}" target="_blank">evidence ↗</a>`:''}</span>
      <span class="tag ${x.verified?'verified':''}">${x.verified?'verified':esc(x.source)}</span></div>`).join(''):'<p class="dim">no contacts on file</p>')+
    `<h3>funding events (${fs.length})</h3>`+
    fs.map(x=>`<div class="ev"><b>${fmt$(x.amount_usd)||'—'}</b> · ${esc(x.program||x.source)}<br>${esc(x.event_date)}${x.evidence?` · <a href="${esc(x.evidence.startsWith('http')?x.evidence:'https://'+x.evidence)}" target="_blank">evidence ↗</a>`:''}</div>`).join('');
}

$('#q').oninput=()=>{clearTimeout(window._t);window._t=setTimeout(load,300)};
$('#filt').onchange=load; $('#sort').onchange=load;
load();
</script></body></html>
